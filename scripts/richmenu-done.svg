<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="843" viewBox="0 0 2500 843">
  <rect width="2500" height="843" fill="#14532d"/>

  <!-- Big "reported" state menu: tap anywhere to report another -->
  <rect x="40" y="40" width="1200" height="763" rx="60" fill="#16a34a"/>
  <text x="640" y="300" font-family="Helvetica" font-size="240" fill="white" text-anchor="middle">✓</text>
  <text x="640" y="470" font-family="Helvetica" font-weight="bold" font-size="90" fill="white" text-anchor="middle">REPORTED</text>
  <text x="640" y="600" font-family="Helvetica" font-size="70" fill="#dcfce7" text-anchor="middle">service logged</text>

  <rect x="1260" y="40" width="1200" height="763" rx="60" fill="#166534"/>
  <text x="1860" y="360" font-family="Helvetica" font-size="200" fill="white" text-anchor="middle">↩</text>
  <text x="1860" y="520" font-family="Helvetica" font-weight="bold" font-size="80" fill="white" text-anchor="middle">REPORT</text>
  <text x="1860" y="620" font-family="Helvetica" font-weight="bold" font-size="80" fill="white" text-anchor="middle">ANOTHER</text>
</svg>
